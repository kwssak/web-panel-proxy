<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление тарифами - WPP Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            color: #fff;
            margin-bottom: 30px;
            font-size: 28px;
        }
        .form-section {
            background: #1a1a1a;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 30px;
            border: 1px solid #333;
        }
        .form-section h2 {
            color: #fff;
            margin-bottom: 20px;
            font-size: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #b0b0b0;
            font-size: 14px;
        }
        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 12px;
            background: #0a0a0a;
            border: 1px solid #333;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
        }
        input:focus {
            outline: none;
            border-color: #4a9eff;
        }
        button {
            background: #4a9eff;
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.2s;
        }
        button:hover {
            background: #3a8eef;
        }
        .tariffs-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .tariff-card {
            background: #1a1a1a;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #333;
        }
        .tariff-card h3 {
            color: #fff;
            margin-bottom: 15px;
            font-size: 18px;
        }
        .tariff-info {
            margin-bottom: 10px;
            color: #b0b0b0;
            font-size: 14px;
        }
        .tariff-info span {
            color: #fff;
            font-weight: 600;
        }
        .status-active {
            color: #4caf50;
        }
        .status-inactive {
            color: #f44336;
        }
        .message {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }
        .message.success {
            background: #1b5e20;
            color: #fff;
            display: block;
        }
        .message.error {
            background: #b71c1c;
            color: #fff;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>️ Управление тарифами</h1>
        
        <div id="message" class="message"></div>
        
        <div class="form-section">
            <h2>Добавить новый тариф</h2>
            <form id="tariffForm">
                <div class="form-group">
                    <label for="name">Название тарифа</label>
                    <input type="text" id="name" name="name" required placeholder="Например: Premium 30 дней">
                </div>
                <div class="form-group">
                    <label for="price">Цена (₽)</label>
                    <input type="number" id="price" name="price" required step="0.01" placeholder="299.99">
                </div>
                <div class="form-group">
                    <label for="duration_days">Срок действия (дней)</label>
                    <input type="number" id="duration_days" name="duration_days" required placeholder="30">
                </div>
                <div class="form-group">
                    <label for="traffic_limit_gb">Лимит трафика (ГБ)</label>
                    <input type="number" id="traffic_limit_gb" name="traffic_limit_gb" required step="0.1" placeholder="100">
                </div>
                <button type="submit">Добавить тариф</button>
            </form>
        </div>
        
        <div class="form-section">
            <h2>Активные тарифы</h2>
            <div id="tariffsList" class="tariffs-list">
                <p style="color: #b0b0b0;">Загрузка...</p>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api/tariffs';
        
        // Загрузка тарифов
        async function loadTariffs() {
            try {
                const response = await fetch(API_BASE);
                const data = await response.json();
                
                if (data.success) {
                    displayTariffs(data.tariffs);
                } else {
                    showMessage('Ошибка загрузки тарифов', 'error');
                }
            } catch (error) {
                showMessage('Ошибка подключения к API', 'error');
            }
        }
        
        // Отображение тарифов
        function displayTariffs(tariffs) {
            const container = document.getElementById('tariffsList');
            
            if (tariffs.length === 0) {
                container.innerHTML = '<p style="color: #b0b0b0;">Нет активных тарифов</p>';
                return;
            }
            
            container.innerHTML = tariffs.map(tariff => `
                <div class="tariff-card">
                    <h3>${tariff.name}</h3>
                    <div class="tariff-info"> Цена: <span>${tariff.price} ₽</span></div>
                    <div class="tariff-info">⏱ Срок: <span>${tariff.duration_days} дней</span></div>
                    <div class="tariff-info">📊 Трафик: <span>${tariff.traffic_limit_gb} ГБ</span></div>
                    <div class="tariff-info">📌 Статус: <span class="status-active">Активен</span></div>
                </div>
            `).join('');
        }
        
        // Добавление тарифа
        document.getElementById('tariffForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = {
                name: document.getElementById('name').value,
                price: parseFloat(document.getElementById('price').value),
                duration_days: parseInt(document.getElementById('duration_days').value),
                traffic_limit_gb: parseFloat(document.getElementById('traffic_limit_gb').value)
            };
            
            try {
                const response = await fetch(API_BASE, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showMessage(`Тариф успешно добавлен! ID: ${data.id}`, 'success');
                    document.getElementById('tariffForm').reset();
                    loadTariffs();
                } else {
                    showMessage(`Ошибка: ${data.error}`, 'error');
                }
            } catch (error) {
                showMessage('Ошибка подключения к API', 'error');
            }
        });
        
        // Показ сообщений
        function showMessage(text, type) {
            const messageEl = document.getElementById('message');
            messageEl.textContent = text;
            messageEl.className = `message ${type}`;
            
            setTimeout(() => {
                messageEl.className = 'message';
            }, 5000);
        }
        
        // Загрузка при старте
        loadTariffs();
    </script>
</body>
</html>
